name: testes
# Só roda quando você manda (Actions > testes > Run workflow), para não gastar minutos do GitHub a cada commit.
# Rodar em mudanças grandes e antes de publicar uma versão; os testes locais (python -m unittest) rodam em todo commit.
on: workflow_dispatch
jobs:
  executavel:
    # Compila o Katharos.exe num Windows, com o compilador que vem dentro do próprio Windows (o mesmo que qualquer pessoa pode usar
    # para conferir), e roda ele de verdade: lê o PC (--diagnostico) e desenha o painel ao vivo (--foto). Os dois resultados ficam
    # como artefato da execução.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: compila
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          Push-Location exe
          & $csc /nologo /target:winexe /optimize+ /out:..\Katharos.exe /win32icon:katharos.ico /win32manifest:katharos.manifest /resource:katharos.ico,katharos.ico `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Management.dll /r:System.Web.Extensions.dll /r:System.Core.dll Katharos.cs
          if ($LASTEXITCODE) { exit 1 }
          Pop-Location
          (Get-Item .\Katharos.exe).VersionInfo | Format-List FileVersion, ProductName, FileDescription
      - name: roda num Windows de verdade
        shell: pwsh
        timeout-minutes: 5
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'conferencia'; New-Item -ItemType Directory -Force $d | Out-Null
          $p = Start-Process .\Katharos.exe -ArgumentList '--diagnostico', "$d\diagnostico.json" -Wait -PassThru
          if ($p.ExitCode) { Get-Content "$env:USERPROFILE\.katharos\segundo-plano.log" -ErrorAction SilentlyContinue; exit 1 }
          Get-Content "$d\diagnostico.json"
          $p = Start-Process .\Katharos.exe -ArgumentList '--sensores', "$d\sensores.json" -Wait -PassThru
          if ($p.ExitCode) { exit 1 }
          Get-Content "$d\sensores.json"
          $p = Start-Process .\Katharos.exe -ArgumentList '--teste-externos', "$d\teste-externos.txt" -Wait -PassThru
          Get-Content "$d\teste-externos.txt"
          if ($p.ExitCode) { exit 1 }
          $p = Start-Process .\Katharos.exe -ArgumentList '--foto', "$d\painel.png" -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path "$d\painel.png")) { Get-Content "$env:USERPROFILE\.katharos\segundo-plano.log" -ErrorAction SilentlyContinue; exit 1 }
      - uses: actions/upload-artifact@v4
        with: { name: executavel, path: Katharos.exe }
      - uses: actions/upload-artifact@v4
        with: { name: conferencia-executavel, path: '${{ runner.temp }}/conferencia' }
  python:
    # 3.8 é o mínimo prometido; o runner novo do Ubuntu não traz essa versão, por isso a 22.04 para ela.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: '3.8' }
          - { os: ubuntu-latest, python: '3.13' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python }}' }
      - run: python -m unittest discover -s tests -v
  powershell:
    # Confere a sintaxe de todo script de item no PowerShell 5.1 de verdade (o do Windows).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tests/exporta_ps.py $env:RUNNER_TEMP\ps
      - shell: powershell
        run: |
          $ruim = 0
          foreach ($f in Get-ChildItem "$env:RUNNER_TEMP\ps" -Filter *.ps1) {
            $erros = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$erros)
            if ($erros) { $ruim++; Write-Host "ERRO em $($f.Name):"; $erros | Select-Object -First 3 | ForEach-Object { Write-Host "  $($_.Message) (linha $($_.Extent.StartLineNumber))" } }
          }
          Write-Host "$ruim script(s) com erro de sintaxe"
          if ($ruim) { exit 1 }
  windows-real:
    # Roda o programa de verdade num Windows descartável: benchmark e ida e volta do desfazer.
    # Experimental: ainda não vimos este job rodar, por isso não derruba o resultado geral.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: testes de unidade no Windows
        run: python -m unittest discover -s tests -v
      - name: benchmark apaga os arquivos de teste
        shell: pwsh
        run: |
          python programa/katharos.py benchmark --sem-cor
          $sobrou = @(Get-ChildItem "$HOME\.katharos\bench" -ErrorAction SilentlyContinue).Count
          Write-Host "arquivos sobrando em bench: $sobrou"
          if ($sobrou) { exit 1 }
      - name: ida e volta do desfazer (privacidade)
        shell: pwsh
        run: |
          reg export "HKCU\Software" "$env:RUNNER_TEMP\antes.reg" /y | Out-Null
          python programa/katharos.py privacidade --sim --modo seguro --sem-cor
          python programa/katharos.py desfazer privacidade --sim --sem-cor
          reg export "HKCU\Software" "$env:RUNNER_TEMP\depois.reg" /y | Out-Null
          $a = Get-Content "$env:RUNNER_TEMP\antes.reg" | Where-Object { $_ -and $_ -notmatch '^(Windows Registry|\[)' } | Sort-Object
          $d = Get-Content "$env:RUNNER_TEMP\depois.reg" | Where-Object { $_ -and $_ -notmatch '^(Windows Registry|\[)' } | Sort-Object
          $dif = Compare-Object $a $d
          Write-Host "linhas diferentes entre antes e depois: $(@($dif).Count)"
          $dif | Select-Object -First 30 | ForEach-Object { Write-Host "$($_.SideIndicator) $($_.InputObject)" }
      - name: ida e volta de arquivo de jogo (Minecraft)
        shell: pwsh
        run: ./tests/ci_minecraft.ps1
      - name: ida e volta de arquivo de jogo (Unreal Engine)
        shell: pwsh
        run: ./tests/ci_unreal.ps1
      - name: leitura leve de temperatura e consumo (sem janela, só leitura)
        run: |
          python programa/katharos.py amostrar --sem-cor
          python -c "import pathlib,json; p=pathlib.Path.home()/'.katharos'/'horas.jsonl'; l=p.read_text(encoding='utf-8').splitlines(); b=json.loads(l[-1]); print(b); assert b['n']>=1 and 'rn' in b, 'sem leitura de RAM'"
      - name: prova de ganho (o item aplicado acima foi medido) e troca de versão
        run: |
          python programa/katharos.py provas --sem-cor
          python programa/katharos.py versoes --sem-cor
          python -c "import pathlib,json; c=pathlib.Path.home()/'.katharos'; l=[json.loads(x) for x in (c/'provas.jsonl').read_text(encoding='utf-8').splitlines()]; print(len(l), l[0]); assert l and all(isinstance(x['d'].get('livre'), int) for x in l), 'retrato sem leitura de disco'; assert any(isinstance(x['d'].get('svc'), int) for x in l), 'retrato sem servicos'; e=json.loads((c/'ensaios.json').read_text(encoding='utf-8')); print(e[0]['antes']); assert e and e[0]['antes'], 'ensaio sem medida de antes'; s=json.loads((c/'estado.json').read_text(encoding='utf-8')); assert s.get('versao_programa') and s.get('versao_dados'), 'estado sem carimbo de versao'"
      - name: processo criado pelo WMI nasce sem janela (Python da Microsoft Store)
        shell: powershell
        run: |
          $si = New-CimInstance -ClassName Win32_ProcessStartup -ClientOnly -Property @{ ShowWindow = [uint16]0 }
          $r = Invoke-CimMethod -ClassName Win32_Process -MethodName Create -Arguments @{ CommandLine = 'cmd.exe /c exit 0'; ProcessStartupInformation = $si }
          Write-Host "retorno $($r.ReturnValue), pid $($r.ProcessId)"
          if ($r.ReturnValue -ne 0) { throw "o WMI recusou criar o processo escondido: $($r.ReturnValue)" }
      - name: raio-x no Windows real (só leitura) e busca
        run: |
          python programa/katharos.py raiox --sim --sem-cor
          python -c "import pathlib,json; c=pathlib.Path.home()/'.katharos'; m=json.loads(sorted((c/'medidas').glob('*raiox.json'))[-1].read_text(encoding='utf-8')); print({x: m.get(x) for x in ('dpc','interrupcoes','disco_ativo','fila_disco','paginas_s','ram_disponivel','commit_pct')}); assert m.get('commit_pct') is not None and m.get('ram_disponivel') is not None, 'sem leitura de memoria'; assert m.get('dpc') is not None, 'sem leitura de DPC'; h=json.loads((c/'relatorio.json').read_text(encoding='utf-8'))['secoes']['raiox']['dados']['hardware']; print(h); assert isinstance(h['video'], list) and isinstance(h['pentes'], list), 'perfil sem video ou pentes'"
          python programa/katharos.py buscar telemetria --sem-cor
      - name: saúde do Windows (só leitura) e painel
        run: |
          python programa/katharos.py saude --sem-cor
          python programa/katharos.py painel --nao-abrir --sem-cor
          python -c "import pathlib; p=pathlib.Path.home()/'.katharos'/'painel.html'; h=p.read_text(encoding='utf-8'); assert 'Saúde do Windows' in h, 'painel sem a seção de saúde'; print('painel ok', len(h))"

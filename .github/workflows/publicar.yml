name: publicar
# Publica a release sozinho. Duas formas de começar:
#   1. Actions > publicar > Run workflow  (deixe "publicar" desmarcado para um ensaio: faz tudo menos criar a release)
#   2. git tag vX.Y.Z && git push --tags   (a tag precisa ser igual a "v" + VERSAO do programa)
# Antes: subir VERSAO em partes/00-cabecalho.py e escrever a entrada "## X.Y.Z" no CHANGELOG.md.
# O que ele faz: compila o Katharos.exe num Windows (exe/Katharos.cs) e roda ele lá, confere versão, changelog e hashes, roda os testes,
# monta o Katharos.zip (com o executável), assina tudo (atestado do GitHub),
# e cria a release com o texto do changelog. Quem baixa confere com:  gh attestation verify Katharos.zip --repo kessleru/Katharos
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Marque para criar a release de verdade. Desmarcado = ensaio, não publica nada.'
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency: publicar
jobs:
  executavel:
    # Compila o Katharos.exe num Windows, com o compilador que vem dentro do próprio Windows (o mesmo que qualquer pessoa pode usar
    # para conferir), e roda ele de verdade: lê o PC (--diagnostico) e desenha o painel ao vivo (--foto). Os dois resultados ficam
    # como artefato da execução.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: compila
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          Push-Location exe
          & $csc /nologo /target:winexe /optimize+ /out:..\Katharos.exe /win32icon:katharos.ico /win32manifest:katharos.manifest /resource:katharos.ico,katharos.ico `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Management.dll /r:System.Web.Extensions.dll /r:System.Core.dll /resource:regras.json,regras.json Katharos.cs
          if ($LASTEXITCODE) { exit 1 }
          Pop-Location
          (Get-Item .\Katharos.exe).VersionInfo | Format-List FileVersion, ProductName, FileDescription
      - name: roda num Windows de verdade
        shell: pwsh
        timeout-minutes: 5
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'conferencia'; New-Item -ItemType Directory -Force $d | Out-Null
          $p = Start-Process .\Katharos.exe -ArgumentList '--diagnostico', "$d\diagnostico.json" -Wait -PassThru
          if ($p.ExitCode) { Get-Content "$env:USERPROFILE\.katharos\segundo-plano.log" -ErrorAction SilentlyContinue; exit 1 }
          Get-Content "$d\diagnostico.json"
          $p = Start-Process .\Katharos.exe -ArgumentList '--sensores', "$d\sensores.json" -Wait -PassThru
          if ($p.ExitCode) { exit 1 }
          Get-Content "$d\sensores.json"
          $p = Start-Process .\Katharos.exe -ArgumentList '--teste-fps', "$d\teste-fps.txt" -Wait -PassThru
          Get-Content "$d\teste-fps.txt"
          if ($p.ExitCode) { exit 1 }
          $p = Start-Process .\Katharos.exe -ArgumentList '--teste-custo', "$d\teste-custo.txt", '30' -Wait -PassThru
          Get-Content "$d\teste-custo.txt"
          if ($p.ExitCode) { Get-Content "$env:USERPROFILE\.katharos\segundo-plano.log" -ErrorAction SilentlyContinue; exit 1 }
          $p = Start-Process .\Katharos.exe -ArgumentList '--teste-no-pc', "$d\teste-no-pc.txt" -Wait -PassThru
          Get-Content "$d\teste-no-pc.txt"
          if ($p.ExitCode) { Get-Content "$env:USERPROFILE\.katharos\segundo-plano.log" -ErrorAction SilentlyContinue; exit 1 }
          $p = Start-Process .\Katharos.exe -ArgumentList '--teste-externos', "$d\teste-externos.txt" -Wait -PassThru
          Get-Content "$d\teste-externos.txt"
          if ($p.ExitCode) { exit 1 }
          $p = Start-Process .\Katharos.exe -ArgumentList '--foto', "$d\painel.png" -Wait -PassThru
          if ($p.ExitCode -or -not (Test-Path "$d\painel.png")) { Get-Content "$env:USERPROFILE\.katharos\segundo-plano.log" -ErrorAction SilentlyContinue; exit 1 }
      - name: teste de travadas por driver (rastreio do kernel, 10 s, só lê)
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP"
          $p = Start-Process .\Katharos.exe -ArgumentList '--travadas', '10', "$d\travadas.json" -Wait -PassThru
          $j = Get-Content "$d\travadas.json" -Raw | ConvertFrom-Json
          Write-Host "código $($p.ExitCode), eventos $($j.eventos), sem endereço $($j.sem_endereco), drivers $($j.drivers_carregados), erro: $($j.erro)"
          $j.drivers | Select-Object -First 8 | Format-Table driver, n, maior_us, acima_1ms | Out-String | Write-Host
          if ($p.ExitCode -or $j.eventos -lt 100 -or -not $j.drivers) { exit 1 }
          # a sessão do kernel não pode ficar ligada depois do teste
          $sessao = logman query -ets | Select-String 'NT Kernel Logger'
          if ($sessao) { Write-Host 'a sessão do kernel ficou ligada'; exit 1 }
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.katharos" | Out-Null
          Copy-Item "$d\travadas.json" "$env:USERPROFILE\.katharos\travadas.json"
          python programa/katharos.py travadas --ultimo --sem-cor
          if ($LASTEXITCODE) { exit 1 }
      - name: motor elevado (pipe com senha da sessão), de verdade no Windows
        # O motor que a interface abre como administrador: só aceita quem traz a senha da sessão; senha errada fecha na hora.
        shell: pwsh
        timeout-minutes: 4
        run: |
          $sid = ([System.Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          function Conversa($senhaDada) {
            $senha = [guid]::NewGuid().ToString('N'); $nome = 'katharos-teste-' + [guid]::NewGuid().ToString('N').Substring(0, 8)
            $p = Start-Process python -ArgumentList 'programa\katharos.py', 'api', '--pipe', $nome, '--dono', $sid, '--senha', $senha -PassThru -NoNewWindow
            $c = New-Object System.IO.Pipes.NamedPipeClientStream('.', $nome, [System.IO.Pipes.PipeDirection]::InOut)
            $c.Connect(20000)
            $w = New-Object System.IO.StreamWriter($c); $w.AutoFlush = $true; $r = New-Object System.IO.StreamReader($c)
            $w.WriteLine('{"senha": "' + $(if ($senhaDada) { $senhaDada } else { $senha }) + '"}')
            $linhas = @($r.ReadLine())
            if (-not $senhaDada) {
              $w.WriteLine('{"id": 1, "metodo": "versao"}'); $linhas += $r.ReadLine()
              $w.WriteLine('{"id": 2, "metodo": "aplicar", "params": {"itens": {"servicos": ["x"]}}}'); $linhas += $r.ReadLine()
              $w.WriteLine('{"id": 3, "metodo": "sair"}'); $linhas += $r.ReadLine()
            }
            $c.Dispose(); $null = $p.WaitForExit(20000)
            $linhas | ForEach-Object { Write-Host $_ }
            return @{ linhas = $linhas; codigo = $p.ExitCode }
          }
          $boa = Conversa $null
          if ($boa.linhas[0] -notmatch '"pronto": true' -or $boa.linhas[1] -notmatch '"ok": true' -or $boa.linhas[2] -notmatch 'precisa_aceite') { Write-Host '::error::motor elevado não respondeu certo'; exit 1 }
          $ruim = Conversa 'senha-errada'
          if ($ruim.linhas[0] -notmatch '"codigo": "senha"' -or $ruim.codigo -ne 3) { Write-Host '::error::motor elevado aceitou senha errada'; exit 1 }
          Write-Host 'motor elevado ok: senha certa atende, senha errada fecha'
      - name: antivírus do Windows (Defender) no executável e no programa
        # O mesmo antivírus que vem em todo Windows: se ele marcar algo, a versão não sai. Sem Defender neste Windows do CI, só avisa.
        shell: pwsh
        timeout-minutes: 8
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $mp)) { Write-Host '::warning::Defender indisponível neste Windows do CI'; exit 0 }
          $st = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if ($st) { Write-Host "Defender: motor $($st.AMEngineVersion), assinaturas $($st.AntivirusSignatureVersion) de $($st.AntivirusSignatureLastUpdated)" }
          $ruim = $false
          foreach ($f in 'Katharos.exe', 'programa\katharos.py', 'programa\katharos.ps1', 'KATHAROS.bat') {
            $o = & $mp -Scan -ScanType 3 -File (Resolve-Path $f).Path -DisableRemediation 2>&1 | Out-String
            $c = $LASTEXITCODE
            Write-Host "$f -> código $c"; Write-Host $o.Trim()
            if ($c -eq 2) { Write-Host "::error::o Defender marcou $f"; $ruim = $true }
            elseif ($c -ne 0) { Write-Host "::warning::o Defender não conseguiu verificar $f (código $c)" }
          }
          if ($ruim) { exit 1 }
      - uses: actions/upload-artifact@v4
        with: { name: executavel, path: Katharos.exe }
      - uses: actions/upload-artifact@v4
        with: { name: conferencia-executavel, path: '${{ runner.temp }}/conferencia' }
  interface:
    # O Katharos com janelas (app/, Avalonia + .NET 10): compila no Windows, desenha cada tela (fotos) e conversa com o motor de verdade.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: compila
        shell: pwsh
        run: dotnet build app/Katharos.App/Katharos.App.csproj -c Release
      - name: fotos de cada tela e conversa com o motor
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'fotos'
          dotnet run --project app/Katharos.Fotos -c Release -- $d
          if ($LASTEXITCODE) { exit 1 }
          $env:KATHAROS_MOTOR = (Resolve-Path programa\katharos.py).Path
          dotnet run --project app/Katharos.Fotos -c Release -- --motor
          if ($LASTEXITCODE) { exit 1 }
      - uses: actions/upload-artifact@v4
        with: { name: fotos-da-interface, path: '${{ runner.temp }}/fotos' }
  instalador:
    # O Katharos com janelas, instalável: o aplicativo (.NET 10, sem precisar instalar o .NET), o motor (katharos.py e katharos.ps1),
    # o Katharos.exe do segundo plano, o PresentMon e o Python embutido (versão e SHA-256 fixos), empacotados pelo Velopack. No ensaio,
    # instala de verdade, em silêncio, e confere que o motor instalado responde com o Python que veio junto.
    needs: executavel
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PY_VERSAO: '3.14.10'
      PY_SHA256: '90905e64a840557d8c1bc4f5b74db3d7ee85e3ffb217611cac1c7813acea4159'
      PM_VERSAO: v2.6.0
      VPK_VERSAO: '1.2.161'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/download-artifact@v4
        with: { name: executavel, path: artefato }
      - name: monta a pasta do aplicativo
        shell: pwsh
        run: |
          $V = (Select-String -Path programa\katharos.py -Pattern "^VERSAO = '([^']+)'").Matches[0].Groups[1].Value
          "V=$V" >> $env:GITHUB_ENV
          dotnet publish app/Katharos.App/Katharos.App.csproj -c Release -r win-x64 --self-contained -o pub -p:Version=$V
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory -Force pub\motor\programa | Out-Null
          Copy-Item programa\katharos.py, programa\katharos.ps1 pub\motor\programa\
          Copy-Item KATHAROS.bat, SHA256SUMS.txt, LICENSE pub\motor\
          Copy-Item artefato\Katharos.exe pub\motor\
          # PresentMon: a mesma versão e a mesma impressão digital do zip
          $nome = gh api "repos/GameTechDev/PresentMon/releases/tags/$env:PM_VERSAO" --jq '[.assets[].name | select(test("x64\\.exe$"; "i")) | select(test("setup|install|capture"; "i") | not)][0]'
          gh release download $env:PM_VERSAO -R GameTechDev/PresentMon -p $nome -D pm
          $esperado = (Select-String -Path exe\Katharos.cs -Pattern 'PRESENTMON_SHA256 = "([0-9a-f]{64})"').Matches[0].Groups[1].Value
          if ((Get-FileHash "pm\$nome" -Algorithm SHA256).Hash.ToLower() -ne $esperado) { Write-Host '::error::PresentMon com impressão digital diferente'; exit 1 }
          Copy-Item "pm\$nome" pub\motor\PresentMon.exe
          Invoke-WebRequest "https://raw.githubusercontent.com/GameTechDev/PresentMon/$env:PM_VERSAO/LICENSE.txt" -OutFile pub\motor\PresentMon-LICENSE.txt
          # Python embutido (python.org), conferido pelo SHA-256 fixo
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PY_VERSAO/python-$env:PY_VERSAO-embed-amd64.zip" -OutFile py.zip
          if ((Get-FileHash py.zip -Algorithm SHA256).Hash.ToLower() -ne $env:PY_SHA256) { Write-Host '::error::Python embutido com SHA-256 diferente'; exit 1 }
          Expand-Archive py.zip pub\python
          $r = & pub\python\python.exe pub\motor\programa\katharos.py api versao
          Write-Host $r
          if ($r -notmatch '"ok": true') { Write-Host '::error::o Python embutido não rodou o motor'; exit 1 }
          Get-ChildItem pub -Recurse -File | Measure-Object -Property Length -Sum | ForEach-Object { Write-Host ("pasta do aplicativo: {0:N1} MB" -f ($_.Sum / 1MB)) }
      - name: empacota (Velopack)
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version $env:VPK_VERSAO
          New-Item -ItemType Directory -Force releases | Out-Null
          # a versão anterior publicada, para gerar o pacote de diferença (na primeira versão com instalador não há nenhuma)
          vpk download github --repoUrl https://github.com/kessleru/Katharos --token $env:GH_TOKEN -o releases
          vpk pack --packId Katharos --packVersion $env:V --packDir pub --mainExe Katharos.exe --packTitle Katharos --packAuthors kessleru `
            --icon app\Katharos.App\Assets\katharos.ico -o releases
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem releases | Format-Table Name, @{n='MB'; e={'{0:N1}' -f ($_.Length / 1MB)}}
      - name: instala de verdade, em silêncio, e confere
        shell: pwsh
        timeout-minutes: 6
        run: |
          $setup = Get-ChildItem releases\*Setup.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '--silent' -PassThru
          $p | Wait-Process -Timeout 240
          $casa = Join-Path $env:LOCALAPPDATA 'Katharos\current'
          foreach ($f in 'Katharos.exe', 'motor\programa\katharos.py', 'motor\Katharos.exe', 'motor\PresentMon.exe', 'python\python.exe') {
            if (-not (Test-Path (Join-Path $casa $f))) { Write-Host "::error::instalado sem $f"; exit 1 }
          }
          $r = & (Join-Path $casa 'python\python.exe') (Join-Path $casa 'motor\programa\katharos.py') api versao
          Write-Host $r
          if ($r -notmatch '"ok": true') { Write-Host '::error::o motor instalado não respondeu'; exit 1 }
          Write-Host 'instalado e conferido'
      - name: atualiza de verdade para uma versão nova e desinstala (com o segundo plano rodando)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $casa = Join-Path $env:LOCALAPPDATA 'Katharos\current'
          $k = Join-Path $env:USERPROFILE '.katharos'
          # o segundo plano instalado, rodando: a troca de versão tem que fechar e religar ele sozinha
          Start-Process (Join-Path $casa 'motor\Katharos.exe') -ArgumentList '--segundo-plano'
          for ($i = 0; $i -lt 60 -and -not (Test-Path "$k\agora.json"); $i++) { Start-Sleep 1 }
          if (-not (Test-Path "$k\agora.json")) { Write-Host '::error::o segundo plano instalado não começou a ler'; exit 1 }
          # uma versão "nova" (os mesmos arquivos, número maior) numa pasta local
          $p = $env:V.Split('.'); $V2 = "{0}.{1}.{2}-ensaio" -f $p[0], $p[1], ([int]($p[2] -replace '\D.*$', '') + 1)
          vpk pack --packId Katharos --packVersion $V2 --packDir pub --mainExe Katharos.exe --packTitle Katharos --packAuthors kessleru -o rel2
          if ($LASTEXITCODE) { exit 1 }
          $antes = (Get-Item (Join-Path $casa 'Katharos.exe')).LastWriteTime
          $pr = Start-Process (Join-Path $casa 'Katharos.exe') -ArgumentList '--teste-atualizacao', (Resolve-Path rel2).Path -PassThru
          $pr | Wait-Process -Timeout 120
          Write-Host "código do ensaio: $($pr.ExitCode)"
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            $sq = Get-ChildItem $casa -Filter 'sq.version' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($sq -and (Get-Content $sq.FullName -Raw) -match [regex]::Escape($V2)) { $ok = $true; break }
            Start-Sleep 1
          }
          Get-Content "$k\interface.log" -ErrorAction SilentlyContinue | Select-Object -Last 10
          if (-not $ok) { Write-Host "::error::não trocou para $V2"; Get-ChildItem $casa | Format-Table Name; exit 1 }
          Write-Host "atualizado para $V2"
          # o segundo plano voltou, já da pasta nova
          $volta = $false
          for ($i = 0; $i -lt 60; $i++) { if (((Get-Date) - (Get-Item "$k\agora.json").LastWriteTime).TotalSeconds -lt 5 -and (Get-Process Katharos -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$casa\motor*" })) { $volta = $true; break }; Start-Sleep 1 }
          if (-not $volta) { Write-Host '::error::o segundo plano não voltou depois da troca de versão'; exit 1 }
          Write-Host 'segundo plano religado depois da troca'
          # desinstala: some a pasta do programa, ficam os dados (backups do desfazer) em ~/.katharos
          $u = Join-Path $env:LOCALAPPDATA 'Katharos\Update.exe'
          Start-Process $u -ArgumentList '--uninstall', '--silent' -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $casa); $i++) { Start-Sleep 1 }
          if (Test-Path $casa) { Write-Host '::error::a desinstalação deixou a pasta do programa'; exit 1 }
          if (-not (Test-Path "$k\estado.json") -and -not (Test-Path "$k\agora.json")) { Write-Host '::error::a desinstalação apagou os dados'; exit 1 }
          if (Get-Process Katharos -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$casa*" }) { Write-Host '::error::sobrou processo do Katharos'; exit 1 }
          Write-Host 'desinstalado: programa removido, dados guardados'
      - uses: actions/upload-artifact@v4
        with: { name: instalador, path: releases }
  publicar:
    needs: [executavel, interface, instalador]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLICA: ${{ github.event_name == 'push' || inputs.publicar }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/download-artifact@v4
        with: { name: executavel, path: saida/exe }
      - uses: actions/download-artifact@v4
        with: { name: instalador, path: saida/instalador }
      - name: PresentMon (medida de FPS, Intel, licença MIT), versão fixa
        env: { PM_VERSAO: v2.6.0 }
        run: |
          mkdir -p saida/pm
          NOME=$(gh api "repos/GameTechDev/PresentMon/releases/tags/$PM_VERSAO" --jq '[.assets[].name | select(test("x64\\.exe$"; "i")) | select(test("setup|install|capture"; "i") | not)][0]')
          if [ -z "$NOME" ] || [ "$NOME" = "null" ]; then echo "::error::não achei o PresentMon de console na release $PM_VERSAO"; exit 1; fi
          gh release download "$PM_VERSAO" -R GameTechDev/PresentMon -p "$NOME" -D saida/pm
          mv "saida/pm/$NOME" saida/pm/PresentMon.exe
          curl -sSfL "https://raw.githubusercontent.com/GameTechDev/PresentMon/$PM_VERSAO/LICENSE.txt" -o saida/pm/PresentMon-LICENSE.txt
          echo "PresentMon $PM_VERSAO ($NOME):"; sha256sum saida/pm/*
          # a impressão digital tem de ser a que o Katharos.exe confere antes de rodar (PRESENTMON_SHA256 em exe/Katharos.cs)
          ESPERADO=$(grep -oP 'PRESENTMON_SHA256 = "\K[0-9a-f]{64}' exe/Katharos.cs)
          ACHADO=$(sha256sum saida/pm/PresentMon.exe | cut -d' ' -f1)
          if [ "$ESPERADO" != "$ACHADO" ]; then echo "::error::PresentMon baixado ($ACHADO) não é o esperado ($ESPERADO)"; exit 1; fi
      - name: versão, changelog e tag
        id: v
        run: |
          V=$(python - <<'PY'
          import re
          print(re.search(r"^VERSAO = '([^']+)'", open('programa/katharos.py', encoding='utf-8').read(), re.M).group(1))
          PY
          )
          echo "versao=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "::error::a tag ${GITHUB_REF_NAME} não é igual a v$V (VERSAO do programa)"; exit 1
          fi
          if [ "$PUBLICA" = "true" ] && gh release view "v$V" >/dev/null 2>&1; then
            echo "::error::a release v$V já existe; suba a versão antes de publicar de novo"; exit 1
          fi
          python .github/scripts/notas_release.py "$V" > notas.md
          case "$V" in *-*) echo "pre=--prerelease" >> "$GITHUB_OUTPUT" ;; *) echo "pre=" >> "$GITHUB_OUTPUT" ;; esac
      - name: testes
        run: python -m unittest discover -s tests
      - name: SHA256SUMS.txt bate com os arquivos
        run: sha256sum --check SHA256SUMS.txt
      - name: monta os arquivos da release
        run: |
          mkdir -p saida
          git archive --format=zip --prefix=Katharos/ HEAD KATHAROS.bat programa README.md LICENSE SECURITY.md CHANGELOG.md SHA256SUMS.txt -o saida/Katharos.zip
          mkdir -p saida/z/Katharos && cp saida/exe/Katharos.exe saida/pm/PresentMon.exe saida/pm/PresentMon-LICENSE.txt saida/z/Katharos/
          (cd saida/z && zip -q -X ../Katharos.zip Katharos/Katharos.exe Katharos/PresentMon.exe Katharos/PresentMon-LICENSE.txt)
          cp programa/katharos.py saida/katharos.py
          (cd saida && sha256sum katharos.py Katharos.zip > SHA256SUMS-release.txt && (cd z && sha256sum Katharos/Katharos.exe Katharos/PresentMon.exe) >> SHA256SUMS-release.txt)
          # o instalador (Velopack): Setup, pacote completo (e de diferença, quando há versão anterior) e o índice que a atualização lê
          ls -la saida/instalador
          (cd saida/instalador && sha256sum *Setup.exe *.nupkg >> ../SHA256SUMS-release.txt)
          unzip -l saida/Katharos.zip
          python .github/scripts/notas_release.py "${{ steps.v.outputs.versao }}" "$(sha256sum programa/katharos.py | cut -d' ' -f1)" > notas.md
          cat saida/SHA256SUMS-release.txt
      - name: atestado de procedência (assinatura do GitHub)
        if: env.PUBLICA == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            saida/instalador/*Setup.exe
            saida/instalador/*.nupkg
            saida/Katharos.zip
            saida/exe/Katharos.exe
            saida/katharos.py
      - name: cria a release
        if: env.PUBLICA == 'true'
        run: |
          gh release create "${{ steps.v.outputs.tag }}" saida/instalador/* saida/Katharos.zip saida/katharos.py saida/SHA256SUMS-release.txt \
            --title "Katharos ${{ steps.v.outputs.versao }}" --notes-file notas.md --target "$GITHUB_SHA" --latest ${{ steps.v.outputs.pre }}
      - name: ensaio
        if: env.PUBLICA != 'true'
        run: |
          echo "Ensaio: tudo conferido, nada publicado. A release teria o título 'Katharos ${{ steps.v.outputs.versao }}' e este texto:"
          cat notas.md
